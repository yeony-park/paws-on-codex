name: Feature request
description: Suggest a new capability or an improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Small pet, translation, and documentation contributions can go directly to a pull request without opening an issue first.

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What need would this feature address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or workflow you would like to see.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: Suggested scope
      description: Optional. List concrete tasks or affected areas if you know them.
      placeholder: |
        - [ ] Update ...
        - [ ] Add ...
        - [ ] Document ...

  - type: textarea
    id: benefit
    attributes:
      label: Expected benefit
      description: Who would benefit, and how?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Describe any workarounds or alternative designs.

  - type: textarea
    id: references
    attributes:
      label: Additional context
      description: Optional links, designs, examples, or related issues.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues for similar requests.
          required: true
