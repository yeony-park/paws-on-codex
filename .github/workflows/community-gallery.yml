name: Validate contributions and publish community gallery

on:
  # Run the same required check for every pull request. Do not add a paths
  # filter here: skipped required workflows remain pending and block merging.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-content:
    name: validate-content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/chatgpt/server/package-lock.json
            apps/chatgpt/web/package-lock.json
      - run: python -m pip install Pillow==12.3.0
      - run: python -m unittest discover -s tests
      - run: python scripts/validate-community-submissions.py
      - name: Validate Canvas UI
        working-directory: apps/chatgpt/web
        run: npm ci --ignore-scripts && npm run typecheck && npm run build
      - name: Validate MCP server
        working-directory: apps/chatgpt/server
        run: npm ci --ignore-scripts && npm test && npm run typecheck && npm run build
      - name: Package self-contained plugin
        run: node scripts/package-chatgpt-plugin.mjs
      - name: Validate plugin release metadata
        run: node scripts/validate-plugin-release.mjs
      - name: Validate packaged pet assets
        run: python scripts/validate-packaged-plugin-assets.py
      - name: Smoke-test packaged plugin
        run: node scripts/test-plugin-package.mjs
      - name: Reject stale generated plugin files
        run: git diff --exit-code -- plugins/paws-on-codex THIRD_PARTY_LICENSES.md

  plugin-container:
    name: plugin-container
    if: github.event_name != 'pull_request'
    needs: validate-content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build production image
        run: docker build -f apps/chatgpt/server/Dockerfile -t paws-on-codex-plugin:ci .
      - name: Test production image
        run: |
          docker run --rm paws-on-codex-plugin:ci node -e "const fs=require('fs'); for(const f of ['LICENSE','ASSETS-LICENSE.md','THIRD_PARTY_LICENSES.md']) if(!fs.existsSync('/app/'+f)) throw new Error(f+' is missing')"
          docker run --rm -d --name paws-on-codex-plugin-ci -p 18787:8787 -e HOST=0.0.0.0 -e PORT=8787 -e NODE_ENV=production -e PAWS_PUBLIC_BASE_URL=https://paws.example.test -e PAWS_COMPONENT_DOMAIN=https://paws-ui.example.test -e OPENAI_APPS_CHALLENGE=ci-challenge paws-on-codex-plugin:ci
          trap 'docker stop paws-on-codex-plugin-ci' EXIT
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:18787/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:18787/.well-known/openai-apps-challenge | grep -qx ci-challenge
          curl -fsS -o /dev/null http://127.0.0.1:18787/assets/chapssari/spritesheet.webp
          curl -fsS -o /dev/null http://127.0.0.1:18787/assets/mandu/spritesheet.webp
          node -e "const response=await fetch('http://127.0.0.1:18787/mcp',{method:'POST',headers:{'content-type':'application/json',accept:'application/json, text/event-stream'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2025-11-25',capabilities:{},clientInfo:{name:'container-ci',version:'1.0.0'}}})}); if(!response.ok||!(await response.text()).includes('serverInfo')) process.exit(1)"

  publish:
    name: publish-community-gallery
    # Publishing can only start after a change has been reviewed, approved,
    # and merged into main. Pull requests never receive write permissions.
    if: github.event_name == 'push'
    needs: validate-content
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==12.3.0
      - run: python scripts/convert-community-photos.py
      - run: python scripts/generate-community-gallery.py
      - run: python scripts/validate-community-submissions.py
      - run: |
          git config user.name "paws-on-codex-bot"
          git config user.email "actions@users.noreply.github.com"
          git add community-pets
          git diff --cached --quiet || git commit -m "chore: publish community gallery"
          git push
