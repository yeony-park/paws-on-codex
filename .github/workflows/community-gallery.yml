name: Publish community gallery

on:
  push:
    branches: [main]
    paths:
      - "community-pets/**"
      - "scripts/convert-community-photos.py"
      - "scripts/generate-community-gallery.py"
      - "scripts/validate-community-submissions.py"
  pull_request:
    paths:
      - "community-pets/**"
      - "scripts/convert-community-photos.py"
      - "scripts/generate-community-gallery.py"
      - "scripts/validate-community-submissions.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - run: python scripts/validate-community-submissions.py

  publish:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - run: python scripts/convert-community-photos.py
      - run: python scripts/generate-community-gallery.py
      - run: python scripts/validate-community-submissions.py
      - run: |
          git config user.name "paws-on-codex-bot"
          git config user.email "actions@users.noreply.github.com"
          git add community-pets
          git diff --cached --quiet || git commit -m "chore: publish community gallery"
          git push
